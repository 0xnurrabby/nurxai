# Render Blueprint for the NurXai dashboard.
# The dashboard lives in the dashboard/ subdirectory. Secrets are not stored
# here; keys marked sync: false are entered once in the Render Dashboard.
# Optional tuning variables (AI timeouts, x402/PAYG keys, dev grants) are
# intentionally omitted because the code falls back to safe defaults.

services:
  - type: web
    name: nurxai-dashboard
    runtime: node
    region: singapore
    plan: free
    branch: main
    rootDir: dashboard
    autoDeployTrigger: commit
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    domains:
      - nurxai.xyz
    envVars:
      # URLs and environment flags.
      - key: PUBLIC_URL
        value: https://nurxai.xyz
      - key: NEXT_PUBLIC_APP_URL
        value: https://nurxai.xyz
      - key: SESSION_COOKIE_DOMAIN
        value: nurxai.xyz
      - key: STRICT_ENV_VALIDATION
        value: "true"
      - key: NEXT_PUBLIC_GOOGLE_DIRECT_AUTH
        value: "true"

      # Database (runtime + migration connections).
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_DATABASE_URL
        sync: false

      # Auth and email secrets.
      - key: JWT_SECRET
        sync: false
      - key: AUTH_RATE_LIMIT_PEPPER
        sync: false
      - key: OTP_PEPPER
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false

      # Google sign-in (direct flow).
      - key: NEXT_PUBLIC_GOOGLE_CLIENT_ID
        sync: false

      # AI Gateway.
      - key: AI_GATEWAY_API_KEY
        sync: false

      # Billing.
      - key: NOWPAYMENTS_API_KEY
        sync: false
      - key: NOWPAYMENTS_IPN_SECRET
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: BASE_PAY_RECIPIENT
        sync: false
      - key: BASE_RPC_URL
        value: https://mainnet.base.org

      # Chrome Web Store release compatibility.
      - key: LEGACY_STORE_VERSION
        value: 2.0.17
      - key: LEGACY_AUTH_FALLBACK_ENABLED
        value: "false"
      - key: MIN_EXTENSION_VERSION
        value: 2.0.14
