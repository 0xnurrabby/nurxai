name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            dashboard/package-lock.json

      - name: Install deploy tooling
        run: npm ci

      - name: Build Worker
        run: npm run cf:build

      - name: Apply database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          test -n "$DATABASE_URL"
          npm --prefix dashboard run migrate:deploy

      - name: Deploy application Worker
        run: npx wrangler deploy

      - name: Deploy paid-plan probe
        run: npx wrangler deploy --config wrangler.probe.jsonc

      - name: Deploy production edge router
        run: npx wrangler deploy --config wrangler.edge.jsonc

      - name: Configure billing reconciliation secret
        env:
          BILLING_RECONCILE_SECRET: ${{ secrets.BILLING_RECONCILE_SECRET }}
        run: |
          test -n "$BILLING_RECONCILE_SECRET"
          printf '%s' "$BILLING_RECONCILE_SECRET" | npx wrangler secret put BILLING_RECONCILE_SECRET --config wrangler.edge.jsonc
