name: Sync Production Runtime

on:
  schedule:
    - cron: "37 0,12 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: Runtime mode override
        type: choice
        required: true
        default: auto
        options:
          - auto
          - cloudflare
          - vercel

concurrency:
  group: production-runtime-mode
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Wrangler
        run: npm ci

      - name: Configure Cloudflare authentication
        env:
          WRANGLER_CONFIG: ${{ secrets.CLOUDFLARE_WRANGLER_CONFIG }}
        run: |
          mkdir -p "$HOME/.config/.wrangler/config"
          printf '%s' "$WRANGLER_CONFIG" > "$HOME/.config/.wrangler/config/github-actions.toml"

      - name: Select healthy runtime
        env:
          REQUESTED_MODE: ${{ inputs.mode || 'auto' }}
          PROBE_TOKEN: ${{ secrets.CLOUDFLARE_PLAN_PROBE_TOKEN }}
        run: |
          mode="$REQUESTED_MODE"
          if [ "$mode" = "auto" ]; then
            status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --max-time 10 \
              --header "Authorization: Bearer $PROBE_TOKEN" \
              https://nurxai-plan-probe.nurw3b.workers.dev || true)"
            if [ "$status" = "200" ]; then
              mode="cloudflare"
            else
              mode="vercel"
            fi
          fi

          npx wrangler kv key put production-mode "$mode" \
            --namespace-id 83eef786275a4760ba513c78628b7530 \
            --remote \
            --profile github-actions
          echo "Production runtime mode: $mode"
